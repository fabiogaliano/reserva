<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Dark Slate Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <!-- Edge Ambient Glow (Orange + Indigo) -->
    <radialGradient id="edge-glow" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Border Stroke -->
    <linearGradient id="border-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Selected Slot Gradient -->
    <linearGradient id="active-slot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-weight: 700; font-size: 42px; fill: #f8fafc; letter-spacing: -0.04em; }
    .subtitle { font-weight: 400; font-size: 15px; fill: #94a3b8; letter-spacing: -0.01em; line-height: 1.5; }
    .badge-text { font-weight: 500; font-size: 12px; fill: #cbd5e1; letter-spacing: 0.02em; }
    .tag { font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 0.1em; }
    .slot-time { font-size: 11px; font-weight: 500; fill: #64748b; }
    .slot-time-active { font-size: 11px; font-weight: 600; fill: #c7d2fe; }
    .api-text { font-size: 17px; font-weight: 600; fill: #c7d2fe; letter-spacing: 0.04em; }
  </style>

  <!-- Panel Base & Outer Glow -->
  <rect x="1.5" y="1.5" width="997" height="297" rx="16" fill="url(#card-bg)"/>
  <rect x="1.5" y="1.5" width="997" height="297" rx="16" fill="url(#edge-glow)"/>
  <rect x="1.5" y="1.5" width="997" height="297" rx="16" fill="none" stroke="url(#border-stroke)" stroke-width="1.5"/>

  <!-- ================= LEFT: BRAND & DESCRIPTION ================= -->

  <!-- Eyebrow Status Indicator -->
  <g transform="translate(56, 46)">
    <circle cx="4" cy="3.5" r="3" fill="#10b981"/>
    <text class="font-sans tag" x="16" y="7">OPEN SOURCE EDGE BOOKING ENGINE</text>
  </g>

  <!-- Logo (3x3 Grid) + Reserva Wordmark -->
  <g transform="translate(56, 120)">
    <!-- 3x3 Fixed Capacity Indicator (Aligned to Cap-Height) -->
    <g transform="translate(0, -30)">
      <circle cx="4" cy="4" r="3.2" fill="#f8fafc"/>
      <circle cx="17" cy="4" r="3.2" fill="#f8fafc"/>
      <circle cx="30" cy="4" r="3.2" fill="#f8fafc"/>

      <circle cx="4" cy="17" r="3.2" fill="#f8fafc"/>
      <circle cx="17" cy="17" r="3.2" fill="#f8fafc"/>
      <circle cx="30" cy="17" r="3.2" fill="#334155" opacity="0.6"/>

      <circle cx="4" cy="30" r="3.2" fill="#f8fafc"/>
      <circle cx="17" cy="30" r="3.2" fill="#334155" opacity="0.6"/>
      <circle cx="30" cy="30" r="3.2" fill="#334155" opacity="0.6"/>
    </g>

    <text class="font-sans title" x="48" y="0">reserva</text>
  </g>

  <!-- Subtitle -->
  <text class="font-sans subtitle" x="56" y="156">Fixed-capacity booking engine for Astro,</text>
  <text class="font-sans subtitle" x="56" y="178">running on Cloudflare Workers + D1.</text>

  <!-- Tech Badges -->
  <g transform="translate(56, 222)">
    <!-- Pill: Astro -->
    <rect x="0" y="0" width="74" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="font-sans badge-text" x="37" y="18" text-anchor="middle">Astro</text>

    <!-- Pill: Cloudflare Workers + D1 -->
    <rect x="84" y="0" width="186" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="font-sans badge-text" x="177" y="18" text-anchor="middle">Cloudflare Workers + D1</text>

    <!-- Pill: Stripe-ready -->
    <rect x="280" y="0" width="112" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="font-sans badge-text" x="336" y="18" text-anchor="middle">Stripe-ready</text>
  </g>

  <!-- ================= RIGHT: SCHEDULER & API FLOW ================= -->


  <g transform="translate(535, 0)">
    <!-- 1. Input Node & Leader Line -->
    <circle cx="10" cy="112" r="3.5" fill="#818cf8"/>
    <line x1="18" y1="112" x2="68" y2="112" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- 2. Time Slot Selector (09:00 - 13:00) -->
    <g transform="translate(74, 76)">
      <!-- Slot 09:00 -->
      <text class="font-mono slot-time" x="20" y="0" text-anchor="middle">09:00</text>
      <rect x="0" y="12" width="40" height="40" rx="8" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>

      <!-- Slot 10:00 (Active / Booked) -->
      <g transform="translate(54, 0)">
        <text class="font-mono slot-time-active" x="20" y="0" text-anchor="middle">10:00</text>
        <rect x="0" y="12" width="40" height="40" rx="8" fill="url(#active-slot-bg)" stroke="#818cf8" stroke-width="1.5"/>
        <!-- Checkmark -->
        <path d="M14 32 L19 37 L28 26" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Slot 11:00 -->
      <g transform="translate(108, 0)">
        <text class="font-mono slot-time" x="20" y="0" text-anchor="middle">11:00</text>
        <rect x="0" y="12" width="40" height="40" rx="8" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
      </g>

      <!-- Slot 12:00 -->
      <g transform="translate(162, 0)">
        <text class="font-mono slot-time" x="20" y="0" text-anchor="middle">12:00</text>
        <rect x="0" y="12" width="40" height="40" rx="8" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
      </g>

      <!-- Slot 13:00 -->
      <g transform="translate(216, 0)">
        <text class="font-mono slot-time" x="20" y="0" text-anchor="middle">13:00</text>
        <rect x="0" y="12" width="40" height="40" rx="8" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
      </g>
    </g>

    <!-- 3. Circuit Path to Real-Time Clock -->
    <path d="M 94 130 L 94 218 L 175 218" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- 4. Real-Time Engine Clock Node -->
    <g transform="translate(210, 218)">
      <circle cx="0" cy="0" r="30" fill="#0c1017" stroke="#334155" stroke-width="1.2"/>
      <!-- Ticks -->
      <line x1="0" y1="-30" x2="0" y2="-24" stroke="#475569" stroke-width="1"/>
      <line x1="0" y1="24" x2="0" y2="30" stroke="#475569" stroke-width="1"/>
      <line x1="-30" y1="0" x2="-24" y2="0" stroke="#475569" stroke-width="1"/>
      <line x1="24" y1="0" x2="30" y2="0" stroke="#475569" stroke-width="1"/>
      <!-- Hands (matching reference: 12 & 4:30) -->
      <line x1="0" y1="0" x2="0" y2="-17" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="13" y2="13" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.5" fill="#c7d2fe"/>
    </g>

    <!-- 5. Connector Path to API -->
    <line x1="242" y1="218" x2="298" y2="218" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- 6. Edge API Node with Status Dot -->
    <g transform="translate(300, 190)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.2"/>
      <text class="font-sans api-text" x="28" y="34" text-anchor="middle">API</text>

      <!-- Corner Notification / Status Dot -->
      <g transform="translate(48, 8)">
        <circle cx="0" cy="0" r="6.5" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
        <circle cx="0" cy="0" r="3.5" fill="#818cf8"/>
      </g>
    </g>
  </g>
</svg>
