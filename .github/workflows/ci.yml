name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from a single chained job so a red `audit` (stuck on unfixable transitive advisories in
  # astro/wrangler/Cloudflare deps) can't mask whether the code itself is sound. `bun run check`
  # still chains both locally as the strict pre-push gate; CI keeps them separate.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run audit

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  # The contract tables in README.md/AGENTS.md are generated from exported constants; this job
  # re-renders them and fails if the committed docs differ, so a closed vocabulary can't silently rot.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run docs:contract:check

  # Unpublished versions are checked against the registry; published versions fall back to packing
  # because npm refuses even a dry-run over an immutable version. Both paths use the pinned npm CLI
  # so package-shape validation does not vary with the runner's bundled version.
  publish-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check publish artifacts
        shell: bash
        run: |
          status=0

          check_package() {
            local package_name="$1"
            local package_dir="$2"
            local version
            version="$(cd "$package_dir" && node -p "require('./package.json').version")"

            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version is already published; checking its tarball instead."
              (cd "$package_dir" && bunx npm@12.0.2 pack --dry-run) || status=1
            else
              echo "$package_name@$version is unpublished; checking it against the registry."
              (cd "$package_dir" && bunx npm@12.0.2 publish --dry-run --provenance=false) || status=1
            fi
          }

          check_package '@reservajs/astro' .
          check_package '@reservajs/stripe' packages/stripe
          exit "$status"

  # The four checks that consume a built or packed artifact rather than the source tree, in one
  # runner: they share a single checkout and install, and each failure names which step broke.
  # Ordered cheapest-first so a broken build fails before the slower tarball installs run.
  packaged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      # `test:preview` serves the BUILT smoke site through the pinned @astrojs/cloudflare adapter,
      # unlike `e2e`, which only exercises `astro dev`. `test:pack` installs the real tarballs into
      # throwaway consumer projects, so a `files`, bin, or exports mistake fails here instead of
      # after a version is published. `test:quickstart` treats the README's own blocks as
      # executable, so a broken quickstart is a red build rather than a support thread.
      - run: bun run verify:packaged
