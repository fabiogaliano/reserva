name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from a single chained job so a red `audit` (stuck on unfixable transitive advisories in
  # astro/wrangler/Cloudflare deps) can't mask whether the code itself is sound. `bun run check`
  # still chains both locally as the strict pre-push gate; CI keeps them separate.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run audit

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # Builds examples/smoke-site and serves the BUILT output through the pinned @astrojs/cloudflare
  # adapter's `astro preview`, unlike the `e2e` job which only exercises `astro dev` — catches bugs
  # that only manifest in the built worker.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:preview

  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:scheduled

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  # Extracts the README quickstart's own code blocks and installs the packed tarballs into a fresh
  # directory, then books through to confirm. The only check that treats the docs as executable, so
  # a broken quickstart is a red build, not a support thread.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:quickstart

  # The contract tables in README.md/AGENTS.md are generated from exported constants; this job
  # re-renders them and fails if the committed docs differ, so a closed vocabulary can't silently rot.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run docs:contract:check

  # Both tarballs are assembled exactly as the registry would, so a `files`, bin, or exports
  # mistake fails here instead of after a version is permanently published. Pins the npm CLI:
  # the version bundled with Node has accepted package shapes the live registry rejects.
  publish-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: '@reservajs/astro'
        run: bunx npm@12.0.2 publish --dry-run --provenance=false
      - name: '@reservajs/stripe'
        run: bunx npm@12.0.2 publish --dry-run --provenance=false
        working-directory: packages/stripe

  # Packs the real tarball and installs it into a throwaway consumer project outside the repo, so
  # it needs its own job rather than sharing the fast unit-test loop. Redundant with the local
  # `verify` aggregate for the same reason the audit/verify split exists.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:pack
