name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from a single `check` job (audit && typecheck && test && test:workers) so a red audit
  # (a transitive advisory with no fix available yet — see docs/plans/013-hardening-sweep.md item
  # E) can no longer mask whether the code itself is sound: these run independently, not chained,
  # so `verify` still reports even when `audit` fails. `bun run check` (both, chained) remains the
  # strict local pre-push gate; CI deliberately doesn't run it as a single step.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run audit

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # Plan 015 decision 5: test:preview builds examples/smoke-site (superseding the plain `astro
  # build` this job ran before) and additionally serves that BUILT output through the pinned
  # @astrojs/cloudflare adapter's `astro preview` entrypoint, probing it with real requests -- the
  # `e2e` job below only ever exercises `astro dev` (examples/smoke-site/e2e-dev-server.ts), so a
  # bug that only manifests in the built worker would otherwise pass every job here.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:preview

  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:scheduled

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  # Plan 010 decision 3: test:pack packs the real tarball and installs it into a throwaway
  # consumer project outside the repo, so it needs its own job (like smoke) rather than sharing
  # the fast unit-test loop. It's also folded into the local `verify` aggregate, so this job is
  # partly redundant with that one in CI -- deliberately so, matching the audit/verify split's
  # rationale of never letting one slow/red check mask another job's result.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run test:pack
