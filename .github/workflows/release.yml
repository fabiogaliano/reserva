name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  detect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - uses: changesets/action/select-mode@v2.1.1
        id: mode

  version:
    needs: detect
    if: needs.detect.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2.1.1
        with:
          script: bun run release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: release packages'
          pr-base-branch: main

  publish:
    needs: detect
    if: needs.detect.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Publish unpublished package versions
        id: publish
        shell: bash
        run: |
          publish_package() {
            local output_name="$1"
            local package_name="$2"
            local package_dir="$3"
            local version
            version="$(PACKAGE_DIR="$package_dir" bun -e 'const p = await Bun.file(`${process.env.PACKAGE_DIR}/package.json`).json(); process.stdout.write(p.version)')"

            if bun pm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version is already published; skipping."
            else
              (cd "$package_dir" && bunx npm@12.0.2 publish --access public)
            fi
            echo "${output_name}_version=$version" >> "$GITHUB_OUTPUT"
          }

          publish_package astro '@reservajs/astro' .
          publish_package stripe '@reservajs/stripe' packages/stripe
      - name: Create missing GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRO_VERSION: ${{ steps.publish.outputs.astro_version }}
          STRIPE_VERSION: ${{ steps.publish.outputs.stripe_version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          release_package() {
            local package_name="$1"
            local version="$2"
            local changelog="$3"
            local tag="$package_name@$version"
            local notes_file="$RUNNER_TEMP/${package_name##*/}-$version.md"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already has a GitHub release; skipping."
              return
            fi

            awk -v bracketed="## [$version]" -v plain="## $version" '
              $0 == bracketed || $0 == plain { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog" > "$notes_file"
            if [ ! -s "$notes_file" ]; then
              echo "No changelog entry found for $tag." >&2
              exit 1
            fi

            gh release create "$tag" \
              --target "$RELEASE_SHA" \
              --title "$package_name $version" \
              --notes-file "$notes_file"
          }

          release_package '@reservajs/astro' "$ASTRO_VERSION" CHANGELOG.md
          release_package '@reservajs/stripe' "$STRIPE_VERSION" packages/stripe/CHANGELOG.md
