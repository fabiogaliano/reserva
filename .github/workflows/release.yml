name: Release

on:
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Refuse unversioned changesets
        run: |
          pending="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$pending" ]; then
            echo "Apply and commit pending changesets with bun run release:version before publishing." >&2
            exit 1
          fi
      - run: bun run verify
      - name: Publish unpublished package versions
        id: publish
        shell: bash
        run: |
          publish_package() {
            local output_name="$1"
            local package_name="$2"
            local package_dir="$3"
            local version
            version="$(PACKAGE_DIR="$package_dir" bun -e 'const p = await Bun.file(`${process.env.PACKAGE_DIR}/package.json`).json(); process.stdout.write(p.version)')"

            if bun pm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version is already published; skipping."
              echo "${output_name}_published=false" >> "$GITHUB_OUTPUT"
            else
              (cd "$package_dir" && bunx npm@12.0.2 publish --access public)
              echo "${output_name}_published=true" >> "$GITHUB_OUTPUT"
            fi
            echo "${output_name}_version=$version" >> "$GITHUB_OUTPUT"
          }

          publish_package astro '@reservajs/astro' .
          publish_package stripe '@reservajs/stripe' packages/stripe
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRO_PUBLISHED: ${{ steps.publish.outputs.astro_published }}
          ASTRO_VERSION: ${{ steps.publish.outputs.astro_version }}
          STRIPE_PUBLISHED: ${{ steps.publish.outputs.stripe_published }}
          STRIPE_VERSION: ${{ steps.publish.outputs.stripe_version }}
        shell: bash
        run: |
          release_package() {
            local package_name="$1"
            local version="$2"
            local changelog="$3"
            local notes_file="$RUNNER_TEMP/${package_name##*/}-$version.md"
            awk -v heading="## [$version]" '
              $0 == heading { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$changelog" > "$notes_file"
            gh release create "$package_name@$version" \
              --target "$GITHUB_SHA" \
              --title "$package_name $version" \
              --notes-file "$notes_file"
          }

          if [ "$ASTRO_PUBLISHED" = true ]; then
            release_package '@reservajs/astro' "$ASTRO_VERSION" CHANGELOG.md
          fi
          if [ "$STRIPE_PUBLISHED" = true ]; then
            release_package '@reservajs/stripe' "$STRIPE_VERSION" packages/stripe/CHANGELOG.md
          fi
